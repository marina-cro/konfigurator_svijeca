<html lang="en">
<head>

    <!-- FIREBASE (compat verzija - radi bez ES modula) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <header>

                <li id="nav-auth"><a href="login.html">Prijava</a></li>
            </ul>
        </nav>

        <div class="cart-wrapper">
            <a href="#" class="cart" id="cart-toggle">
                <img src="slike/kosarica1.jpg" alt="Košarica">
                <span class="cart-count">0</span>
            </a>
            <div class="cart-dropdown" id="cart-dropdown">
                <h4 class="cart-dropdown-naslov">Vaša košarica</h4>
                <p class="cart-dropdown-prazna" id="cart-dropdown-prazna">Košarica je prazna.</p>
                <div class="cart-dropdown-lista" id="cart-dropdown-lista"></div>
                <div class="cart-dropdown-narudzba" id="cart-narudzba">
                    <textarea id="cart-email" class="cart-email" placeholder="Unesite svoj e-mail" rows="1"></textarea>
                    <button type="button" id="btn-naruci" class="btn-naruci">Naruči</button>
                </div>
            </div>
        </div>

        <section>
            <article class="container1">
                <h1>Ovdje možete potražiti neke od naših već gotovih proizvoda</h1>
            </article>
        </section>
    </header>
    
    <main>
        <section class="container2">
            <div class="container2-grid">
                <article class="card">
                    <h3>Gotova roza torta</h3>
                    <img src="slike/gotova_roza.jpg" alt="Gotova roza torta" width="400">
                    <button type="button">Odaberi</button>
                </article>
                <article class="card">
                    <h3>Rozi cupcake u čaši</h3>
                    <img src="slike/gotovi_cupcake_rozi1.jpg" alt="Rozi cupcake u čaši" width="400">

                </article>
                <article class="card">
                    <h3>Rozi cupcake</h3>
                    <img src="slike/gotovi_cupcake_rozi2.png" alt="Rozi cupcake" width="400">
                    <button type="button">Odaberi</button>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>Potražite nas na društvenim mrežama</p>
        <a href="https://www.instagram.com/glassofhappinesscandles?igsh=d2c0dTgyaGFseGd2"><img src="slike/Instagram_icon.png" alt="Instagram_logo" width="30"></a>
        <a href="https://www.tiktok.com/@glassofhappinessc?_r=1&_t=ZN-96HNe2hvFmI"><img src="slike/tiktok_icon.png" alt="tikTok logo" width="30"></a>
